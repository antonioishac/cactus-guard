# Imagem do backend: build (Dockerfile multi-stage), Trivy image scan, SBOM da imagem e
# push para o GHCR (somente main e tags v*). A imagem publicada é exatamente o tar escaneado.
# Check obrigatório na proteção de branch: "docker-build-scan".
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"] # filtro de paths não se aplica a tags
    paths:
      - "cactusguard-backend/**"
      - ".github/workflows/docker.yml"
      - ".github/trivy.yaml"
  # Sem `paths` em PR de propósito: ver _changes.yml (check obrigatório não pode ficar pendente).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  LOCAL_TAG: cactusguard-backend:ci

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/_changes.yml
    with:
      pattern: '^(cactusguard-backend/|\.github/workflows/(docker|_changes)\.yml$|\.github/trivy\.yaml$)'

  build:
    name: docker-build-scan
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF do Trivy image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cactusguard-backend
          file: cactusguard-backend/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.LOCAL_TAG }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          provenance: false # proveniência é atestada no job de push (attest-build-provenance)

      - name: Data (chave do cache do banco de vulnerabilidades)
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-

      - name: Trivy image (SARIF + SBOM CycloneDX)
        run: |
          set -euo pipefail
          run_trivy() {
            docker run --rm -v "$RUNNER_TEMP:/work" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$GITHUB_WORKSPACE/.github/trivy.yaml:/trivy.yaml:ro" \
              "$TRIVY_IMAGE" image --quiet --config /trivy.yaml --input /work/image.tar "$@"
          }
          run_trivy --scanners vuln,secret --format sarif --output /work/trivy-image.sarif
          run_trivy --format cyclonedx --output /work/sbom-image.cdx.json
          cp "$RUNNER_TEMP/trivy-image.sarif" "$RUNNER_TEMP/sbom-image.cdx.json" .

      - name: Enviar SARIF ao Security tab
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Gate: CRITICAL/HIGH com correção disponível (SO da imagem base + jars) bloqueia.
      - name: Trivy image (gate HIGH/CRITICAL com correção)
        run: |
          docker run --rm -v "$RUNNER_TEMP:/work" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/.github/trivy.yaml:/trivy.yaml:ro" \
            "$TRIVY_IMAGE" image --quiet --config /trivy.yaml --input /work/image.tar \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table

      - name: Publicar SBOM da imagem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image-sbom-cyclonedx
          path: sbom-image.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Guardar imagem escaneada para o push
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image-tar
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  push:
    name: docker-push
    needs: build
    # Só main e tags v* (nunca PR). Único job com escrita no registry.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: registry # permite exigir aprovação/regras de deploy no GitHub (Settings > Environments)
    permissions:
      contents: read
      packages: write # push no GHCR com GITHUB_TOKEN (sem PAT/segredo manual)
      id-token: write # OIDC para assinar a atestação (Sigstore)
      attestations: write # atestação de proveniência SLSA
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image-tar
          path: ${{ runner.temp }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem escaneada
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository }}-backend
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/image.tar"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$LOCAL_TAG" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$LOCAL_TAG" \
            | grep -i "^${IMAGE,,}@" | head -n1 | cut -d@ -f2)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Publicado: ${IMAGE,,}@$digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-backend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
