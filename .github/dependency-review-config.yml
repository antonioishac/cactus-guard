# Política de dependency review (PRs) — ver docs/engenharia/ci-cd.md, seção "Política de dependências".
#
# Vulnerabilidade: bloqueia dependência NOVA/ALTERADA no PR com advisory HIGH ou CRITICAL.
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
  - unknown

# Licenças: bloqueia copyleft FORTE e de rede, incompatíveis com distribuição de SaaS proprietário.
# Copyleft fraco (LGPL, MPL-2.0, EPL-2.0, CDDL) é permitido: uso como biblioteca não contamina o código
# do CactusGuard (exceção registrada exige avaliação jurídica caso haja modificação da própria lib).
# Para exceção pontual use allow-dependencies-licenses com PURL + justificativa no PR (nunca genérica).
deny-licenses:
  - GPL-1.0-only
  - GPL-1.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - SSPL-1.0
  - EUPL-1.1
  - EUPL-1.2
  - OSL-3.0
  - CPAL-1.0
  # Não copyleft, mas incompatíveis com uso comercial/SaaS (source-available / não comercial):
  - BUSL-1.1
  - CC-BY-NC-4.0
  - CC-BY-NC-SA-4.0

# Exceções explícitas (PURL) — vazio de propósito.
# allow-dependencies-licenses:
#   - "pkg:maven/org.exemplo/lib"   # motivo + data + aprovador

# Resumo vai para o job summary; comentar no PR exigiria pull-requests: write (menor privilégio).
comment-summary-in-pr: never
show-openssf-scorecard: true
warn-on-openssf-scorecard-level: 3
