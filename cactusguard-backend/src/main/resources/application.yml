spring:
  application:
    name: cactusguard
  datasource:
    url: jdbc:postgresql://localhost:5432/cactusguard
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:cactusguard-mvp-secret-key-change-in-production-2026}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: cactusguard

resilience4j:
  circuitbreaker:
    instances:
      screening:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      siscoaf:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
      kyc:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      screening:
        max-attempts: 3
        wait-duration: 1s
      siscoaf:
        max-attempts: 3
        wait-duration: 2s
      kyc:
        max-attempts: 3
        wait-duration: 1s

integrations:
  screening:
    provider: ${SCREENING_PROVIDER:dowjones}
    base-url: ${SCREENING_BASE_URL:https://api.dowjones.com}
    api-key: ${SCREENING_API_KEY:}
  siscoaf:
    provider: ${SISCOAF_PROVIDER:coaf}
    base-url: ${SISCOAF_BASE_URL:https://siscoaf.coaf.gov.br}
    certificate-path: ${SISCOAF_CERT_PATH:}
  kyc:
    provider: ${KYC_PROVIDER:serpro}
    base-url: ${KYC_BASE_URL:https://gateway.apiserpro.serpro.gov.br}
    api-key: ${KYC_API_KEY:}

logging:
  level:
    org.springframework.security: INFO
    br.com.cactus.guard: DEBUG
