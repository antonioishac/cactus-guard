spring:
  application:
    name: cactusguard
  profiles:
    # TEMPORÁRIO: sem SPRING_PROFILES_ACTIVE sobe em "dev" (segredos públicos de dev). Em produção definir SPRING_PROFILES_ACTIVE=prod.
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  threads:
    virtual:
      enabled: true
  datasource:
    # TEMPORÁRIO (decisão do time): credencial de DESENVOLVIMENTO versionada, igual ao docker-compose local
    # (pgvector/pgvector:pg17, usuário app_user). Substituir por cofre/variável antes de produção.
    # 127.0.0.1 (não "localhost"): nesta máquina o ::1:5432 é atendido pelo wslrelay (outro PostgreSQL, no WSL).
    # Prefixo CACTUS_ evita colisão com variáveis DB_* de outros projetos já definidas na máquina.
    url: ${CACTUS_DB_URL:jdbc:postgresql://127.0.0.1:5432/cactusguard}
    username: ${CACTUS_DB_USERNAME:app_user}
    password: ${CACTUS_DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      # Dev: container "cactusguard-redis" do docker-compose.yml da raiz do projeto.
      host: ${CACTUS_REDIS_HOST:127.0.0.1}
      port: ${CACTUS_REDIS_PORT:6379}
      # timeouts curtos: Redis fora nao pode travar requisicoes (cache/rate limit tem contingencia)
      timeout: 500ms
      connect-timeout: 1s
  kafka:
    # Dev: cluster KRaft de 3 nos (portas do host). 127.0.0.1, nunca "localhost" (IPv6 ::1 atendido por outro servico).
    bootstrap-servers: ${CACTUS_KAFKA_BOOTSTRAP:127.0.0.1:19092,127.0.0.1:29092,127.0.0.1:39092}
    # Producao (sem segredo no repo; tudo por variavel de ambiente - ver specs/047 secao Eventos):
    #   SASL/SCRAM: CACTUS_KAFKA_SECURITY_PROTOCOL=SASL_SSL, SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=SCRAM-SHA-512,
    #               SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=<jaas com usuario/senha do cofre>
    #   mTLS:       CACTUS_KAFKA_SECURITY_PROTOCOL=SSL + bundle SSL (SPRING_KAFKA_SSL_BUNDLE) com keystore/truststore
    security:
      protocol: ${CACTUS_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # falha rapida com broker fora: o outbox guarda e o relay retenta com backoff
        max.block.ms: ${CACTUS_KAFKA_MAX_BLOCK_MS:5000}
        request.timeout.ms: 4000
        delivery.timeout.ms: 9000
        linger.ms: 5
        # lz4 (lz4-java fixado no pom por CVE); os ITs exercitam a compressao
        compression.type: lz4
    consumer:
      group-id: ${CACTUS_KAFKA_GROUP_ID:cactus-monitoring}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
      # Tracing: span do consumidor com contexto W3C (traceparent) lido do header da mensagem
      observation-enabled: true
    template:
      # Tracing: span do producer + injecao de traceparent no header
      observation-enabled: true

cactus:
  network:
    trusted-proxies: ${CACTUS_TRUSTED_PROXIES:}
  ratelimit:
    # redis = contadores compartilhados entre instancias (contingencia local se o Redis cair); memory = por instancia
    backend: ${CACTUS_RATELIMIT_BACKEND:redis}
    login-per-ip: ${CACTUS_RATELIMIT_LOGIN_PER_IP:10}
    search-per-user: ${CACTUS_RATELIMIT_SEARCH_PER_USER:30}
    api-per-user: ${CACTUS_RATELIMIT_API_PER_USER:100}
    api-per-tenant: ${CACTUS_RATELIMIT_API_PER_TENANT:3000}
    api-per-ip: ${CACTUS_RATELIMIT_API_PER_IP:1000}
  audit:
    chain:
      jobs-enabled: ${CACTUS_AUDIT_CHAIN_JOBS_ENABLED:true}
      verify-cron: "0 30 3 * * *"   # diario 03:30
      anchor-cron: "0 5 * * * *"    # de hora em hora, minuto 5
  metrics:
    # Metricas operacionais por tenant (casos por status, DLQ): snapshot periodico por tenant (RLS)
    operational:
      enabled: ${CACTUS_METRICS_OPERATIONAL_ENABLED:true}
      refresh-interval: 30s
    # Tag `tenant` nas metricas de negocio: DESLIGADA por padrao (cardinalidade). Ligada, limita a N tenants distintos;
    # os demais agregam em tenant="other". Ver spec 038.
    tenant-tag:
      enabled: ${CACTUS_METRICS_TENANT_TAG:false}
      max-tenants: ${CACTUS_METRICS_TENANT_TAG_MAX:50}
  events:
    # Chave mestra dos eventos de dominio (outbox + relay + topicos + consumidores). Perfil test: false.
    enabled: ${CACTUS_EVENTS_ENABLED:true}
    source: cactusguard
    relay:
      enabled: ${CACTUS_EVENTS_RELAY_ENABLED:true}
      poll-interval: 500ms
      batch-size: 100
    cleanup:
      retention-days: ${CACTUS_EVENTS_OUTBOX_RETENTION_DAYS:14}
    topics:
      # Producao com topicos gerenciados fora da aplicacao: CACTUS_EVENTS_TOPICS_CREATE=false
      create: ${CACTUS_EVENTS_TOPICS_CREATE:true}
      partitions: ${CACTUS_EVENTS_TOPIC_PARTITIONS:6}
      replication-factor: ${CACTUS_EVENTS_TOPIC_RF:3}
    consumer:
      enabled: ${CACTUS_EVENTS_CONSUMER_ENABLED:true}

server:
  port: 8080
  # NENHUMA camada confia em X-Forwarded-* por conta propria: o IP real e resolvido por ClientIpResolver, que so aceita
  # o cabecalho de proxies listados em CACTUS_TRUSTED_PROXIES (IPs/CIDRs separados por virgula; vazio = nenhum).
  forward-headers-strategy: none
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true

jwt:
  # Sem default: JWT_SECRET (>= 32 bytes / 256 bits) e obrigatorio fora dos perfis dev/test (fail-fast).
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:cactusguard}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# Segredos de seguranca: sem defaults. Perfis dev/test trazem valores proprios (application-dev.yml).
security:
  crypto:
    # "v1:<base64 32 bytes>[,v2:<base64 32 bytes>]" - rotacao a cada 90 dias (spec 040)
    keys: ${ENCRYPTION_KEYS:}
    active-version: ${ENCRYPTION_ACTIVE_VERSION:}
    # valor bruto da antiga ENCRYPTION_KEY, para ler dados legados sem prefixo
    legacy-key: ${ENCRYPTION_LEGACY_KEY:${ENCRYPTION_KEY:}}
  document-hash:
    key: ${DOCUMENT_HASH_KEY:}
  # Bloqueio progressivo de login (spec 047): N falhas por usuario na janela => bloqueio temporario; limite por IP.
  login-protection:
    max-failures-per-user: ${LOGIN_MAX_FAILURES_PER_USER:5}
    max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
    window-minutes: ${LOGIN_FAILURE_WINDOW_MINUTES:15}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  hsts:
    enabled: ${HSTS_ENABLED:true}

retention:
  # Circular BCB 3.978/2020 art. 67: minimo de 10 anos (3653 dias). Valores menores sao rejeitados.
  audit-days: ${RETENTION_AUDIT_DAYS:3653}

reports:
  output-dir: ${REPORTS_DIR:reports}

kyc:
  upload:
    max-bytes: ${KYC_UPLOAD_MAX_BYTES:10485760}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: cactusguard
  # OpenTelemetry (spec 038). Exportacao OTLP DESLIGADA por padrao: o traceId/spanId continuam gerados (logs, header
  # X-Trace-Id, outbox, Kafka), so nao ha envio. Para exportar: CACTUS_OTEL_ENABLED=true e CACTUS_OTEL_ENDPOINT=<coletor>
  # (ex.: http://otel-collector:4318). Sampling: CACTUS_OTEL_SAMPLING (0.0 a 1.0; prod padrao 0.1, dev 1.0).
  tracing:
    sampling:
      probability: ${CACTUS_OTEL_SAMPLING:0.1}
    export:
      enabled: ${CACTUS_OTEL_ENABLED:false}
    # Baggage nao carrega PII: so ids tecnicos
    baggage:
      correlation:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: cactusguard
      deployment.environment.name: ${CACTUS_ENV:dev}
    tracing:
      export:
        otlp:
          endpoint: ${CACTUS_OTEL_ENDPOINT:http://127.0.0.1:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${CACTUS_OTEL_METRICS_ENABLED:false}
        url: ${CACTUS_OTEL_ENDPOINT:http://127.0.0.1:4318}/v1/metrics
        step: 30s
  # Logs ja saem correlacionados (traceId/spanId/tenantId) no stdout (JSON em prod); sem exportador OTLP de logs.
  logging:
    export:
      otlp:
        enabled: false

resilience4j:
  circuitbreaker:
    instances:
      screening:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      siscoaf:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
      kyc:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      # Broker Kafka do relay do outbox: aberto, o relay pula o ciclo (eventos ficam no outbox)
      kafka-outbox:
        # sem isto o breaker so sairia de OPEN quando alguem pedisse permissao (o relay pula o ciclo em OPEN)
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 1
  retry:
    instances:
      screening:
        max-attempts: 3
        wait-duration: 1s
      siscoaf:
        max-attempts: 3
        wait-duration: 2s
      kyc:
        max-attempts: 3
        wait-duration: 1s

integrations:
  screening:
    provider: ${SCREENING_PROVIDER:dowjones}
    base-url: ${SCREENING_BASE_URL:https://api.dowjones.com}
    api-key: ${SCREENING_API_KEY:}
  siscoaf:
    provider: ${SISCOAF_PROVIDER:coaf}
    base-url: ${SISCOAF_BASE_URL:https://siscoaf.coaf.gov.br}
    certificate-path: ${SISCOAF_CERT_PATH:}
  kyc:
    provider: ${KYC_PROVIDER:serpro}
    base-url: ${KYC_BASE_URL:https://gateway.apiserpro.serpro.gov.br}
    api-key: ${KYC_API_KEY:}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}] [tenant=%X{tenantId:-}]"
  level:
    org.springframework.security: INFO
    br.com.cactus.guard: INFO
