spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS TSVECTOR AS VARCHAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: simple

jwt:
  secret: test-secret-key-for-integration-tests-only
  issuer: cactusguard
security:
  crypto:
    keys: v1:dGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5LTMyYnl0ZSE=
    active-version: v1
  document-hash:
    key: test-only-document-hash-pepper-0123456789abcdef
  cors:
    allowed-origins: http://localhost:3000
  hsts:
    enabled: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# Integracoes externas sempre mockadas nos testes (o default de application.yml aponta para os providers reais)
integrations:
  screening:
    provider: mock
  siscoaf:
    provider: mock
  kyc:
    provider: mock
